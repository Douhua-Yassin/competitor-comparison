<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>经营报告数据管理</title>
  <link rel="stylesheet" href="/static/reporting.css">
</head>
<body>
  <header class="page-header">
    <div>
      <p class="eyebrow">报告程序第二阶段</p>
      <h1>经营报告数据管理</h1>
      <p class="subtitle">统一管理领星快照、产品档位、目标和经营行动。</p>
    </div>
    <div class="header-actions">
      <a class="secondary" href="/">返回竞品监控</a>
      <button id="importAudit" type="button">导入最近一次领星盘点</button>
    </div>
  </header>

  <main>
    <section class="summary-grid" id="summaryGrid">
      <article><span>最近导入</span><strong id="lastImport">未导入</strong></article>
      <article><span>原始接口快照</span><strong id="snapshotCount">0</strong></article>
      <article><span>标准日指标</span><strong id="metricCount">0</strong></article>
      <article><span>状态</span><strong id="pageStatus">正在加载</strong></article>
    </section>

    <section class="panel">
      <div class="panel-heading">
        <div>
          <h2>接口可用性</h2>
          <p>权限失败、参数失败和成功状态会保留到报告数据层。</p>
        </div>
      </div>
      <div id="availability" class="availability-grid"></div>
    </section>

    <section class="panel">
      <div class="panel-heading">
        <div>
          <h2>产品责任与重点档位</h2>
          <p>产品线为默认档位，单个 ASIN 可覆盖产品线设置。</p>
        </div>
      </div>
      <div id="productLines" class="product-lines"></div>
    </section>

    <section class="two-column">
      <article class="panel">
        <div class="panel-heading"><div><h2>新增目标</h2><p>相同口径再次保存会形成新版本，旧版本保留。</p></div></div>
        <form id="targetForm" class="form-grid">
          <label>产品线<select id="targetLine" required></select></label>
          <label>ASIN（可选）<select id="targetAsin"><option value="">整条产品线</option></select></label>
          <label>周期<select id="periodType"><option value="day">日</option><option value="week">周</option><option value="month" selected>月</option><option value="quarter">季度</option><option value="year">年</option></select></label>
          <label>开始日期<input id="periodStart" type="date" required></label>
          <label>结束日期<input id="periodEnd" type="date" required></label>
          <label>指标<select id="metricCode"><option value="sales_amount">销售额</option><option value="units">销量</option><option value="gross_profit">利润</option><option value="profit_margin">利润率</option><option value="tacos">TACOS</option><option value="fba_available">FBA可售库存</option></select></label>
          <label>目标值<input id="targetValue" type="number" step="0.01" required></label>
          <label>单位<input id="targetUnit" type="text" placeholder="USD、件、ratio"></label>
          <label class="full">备注<textarea id="targetNote" rows="3"></textarea></label>
          <button type="submit">保存目标版本</button>
        </form>
        <div id="targetList" class="records"></div>
      </article>

      <article class="panel">
        <div class="panel-heading"><div><h2>新增经营行动</h2><p>记录已经做过的事情、原因、预期和复盘结果。</p></div></div>
        <form id="actionForm" class="form-grid">
          <label>产品线<select id="actionLine" required></select></label>
          <label>ASIN（可选）<select id="actionAsin"><option value="">整条产品线</option></select></label>
          <label>动作日期<input id="actionDate" type="date" required></label>
          <label>动作类型<select id="actionType"><option value="pricing">调价</option><option value="advertising">广告</option><option value="inventory">库存</option><option value="promotion">促销</option><option value="listing">链接</option><option value="variant">变体</option><option value="other">其他</option></select></label>
          <label class="full">标题<input id="actionTitle" type="text" required></label>
          <label class="full">具体内容<textarea id="actionContent" rows="3" required></textarea></label>
          <label class="full">原因<textarea id="actionReason" rows="2"></textarea></label>
          <label class="full">预期结果<textarea id="actionExpected" rows="2"></textarea></label>
          <label>复盘日期<input id="reviewDate" type="date"></label>
          <label>状态<select id="actionStatus"><option value="planned">计划中</option><option value="in_progress">执行中</option><option value="completed">已完成</option><option value="cancelled">已取消</option></select></label>
          <button type="submit">保存行动记录</button>
        </form>
        <div id="actionList" class="records"></div>
      </article>
    </section>
  </main>

  <dialog id="resultDialog">
    <form method="dialog">
      <h3 id="dialogTitle">处理结果</h3>
      <pre id="dialogBody"></pre>
      <button>关闭</button>
    </form>
  </dialog>

  <script src="/static/reporting.js"></script>
</body>
</html>
