<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>经营报告</title>
  <link rel="stylesheet" href="/static/reporting-dashboard.css">
</head>
<body>
  <header class="topbar">
    <div>
      <p class="eyebrow">LINGXING REPORTING</p>
      <h1>经营报告</h1>
      <p id="syncSummary" class="subtitle">正在读取领星数据……</p>
    </div>
    <div class="top-actions">
      <button id="syncButton" type="button">同步最新数据</button>
      <a class="settings-button" href="/reporting/settings" aria-label="打开设置">⚙ 设置</a>
    </div>
  </header>

  <main>
    <section id="syncStatus" class="status-strip">正在加载</section>
    <section id="dashboard" class="dashboard-list">
      <div class="empty-state">正在加载重点产品线……</div>
    </section>
  </main>

  <dialog id="messageDialog">
    <form method="dialog">
      <h3 id="dialogTitle">提示</h3>
      <p id="dialogBody"></p>
      <button>关闭</button>
    </form>
  </dialog>

  <script src="/static/reporting-dashboard.js"></script>
</body>
</html>
