name: Windows Tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  windows-test:
    runs-on: windows-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11']
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run actual first-install script
        shell: pwsh
        run: |
          python -m venv .venv
          $env:CI = '1'
          cmd.exe /d /c "首次安装.bat"
          if ($LASTEXITCODE -ne 0) { throw "首次安装.bat 失败：$LASTEXITCODE" }
          $py = '.\.venv\Scripts\python.exe'
          & $py -m pip install ruff
          & $py -m pip check
          & $py -c "import sys, importlib.metadata as m; print(sys.version); print('Playwright=' + m.version('playwright'))"

      - name: Python compile check
        shell: pwsh
        run: .\.venv\Scripts\python.exe -m compileall -q app tests

      - name: Pytest
        shell: pwsh
        run: .\.venv\Scripts\python.exe -m pytest -q

      - name: Fatal Python lint checks
        shell: pwsh
        run: .\.venv\Scripts\ruff.exe check app tests --select E9,F63,F7,F82

      - name: JavaScript syntax check
        run: node --check app/static/app.js

      - name: Batch script static checks
        shell: pwsh
        run: |
          $files = @(
            '首次安装.bat',
            '启动插件浏览器.bat',
            '启动程序.bat',
            '停止程序.bat',
            '故障检查.bat'
          )
          foreach ($file in $files) {
            if (-not (Test-Path $file)) { throw "缺少文件：$file" }
            $text = Get-Content -Raw -Encoding UTF8 $file
            if ($text -notmatch 'chcp 65001') { throw "$file 缺少 UTF-8 代码页设置" }
            if ($text -match '\^\| Out-Null') { throw "$file 包含会传给 PowerShell 的错误 ^| 语法" }
          }

          $requirements = Get-Content -Raw -Encoding UTF8 'requirements.txt'
          if ($requirements -notmatch 'playwright>=1\.48,<1\.49') {
            throw 'Playwright 未锁定到用户环境可安装的 1.48 系列'
          }

          $start = Get-Content -Raw -Encoding UTF8 '启动程序.bat'
          if ($start -notmatch 'server.pid') { throw '启动程序未写入 server.pid' }
          if ($start -notmatch 'PassThru') { throw '启动程序未获取服务 PID' }
          if ($start -notmatch 'curl\.exe.*--noproxy') { throw '启动程序健康检查未绕过本机代理' }
          if ($start -match 'for /f.*Start-Process') { throw '启动程序仍使用易阻塞的 for /f 捕获进程' }

          $stop = Get-Content -Raw -Encoding UTF8 '停止程序.bat'
          if ($stop -notmatch 'CommandLine') { throw '停止程序未校验进程命令行' }
          if ($stop -notmatch 'ExecutablePath') { throw '停止程序未校验项目虚拟环境' }
          if ($stop -match 'findstr ":8787') { throw '停止程序仍按端口直接杀进程' }

      - name: Real start and stop batch smoke test
        shell: pwsh
        run: |
          .\.venv\Scripts\python.exe -c "from openpyxl import Workbook; w=Workbook(); s=w.active; s.title='测试产品线'; s.append(['品牌','尺寸','ASIN','星级（评价）','售价','是否我方']); s.append(['TEST','13','B0D3D2W989',None,100,'是']); w.save('产品输入表.xlsx')"
          $env:CI = '1'
          cmd.exe /d /c "启动程序.bat"
          if ($LASTEXITCODE -ne 0) { throw "启动程序.bat 失败：$LASTEXITCODE" }
          curl.exe --silent --fail --noproxy "*" --max-time 5 http://127.0.0.1:8787/api/status *> $null
          if ($LASTEXITCODE -ne 0) { throw '启动脚本结束后 8787 不可用' }
          cmd.exe /d /c "停止程序.bat"
          if ($LASTEXITCODE -ne 0) { throw "停止程序.bat 失败：$LASTEXITCODE" }
          Start-Sleep -Seconds 2
          curl.exe --silent --fail --noproxy "*" --max-time 2 http://127.0.0.1:8787/api/status *> $null
          if ($LASTEXITCODE -eq 0) { throw '停止脚本结束后 8787 仍在监听' }
