name: Windows Tests

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: windows-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-test:
    runs-on: windows-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11']
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Parse PowerShell scripts with Windows PowerShell 5.1
        shell: powershell
        run: |
          $files = @(Get-ChildItem scripts -Filter *.ps1) + @(Get-Item 'lingxing_audit.ps1')
          foreach ($file in $files) {
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile(
              $file.FullName,
              [ref]$tokens,
              [ref]$errors
            )
            if ($errors.Count -gt 0) {
              $errors | Format-List
              throw "$($file.Name) has PowerShell syntax errors"
            }
          }

      - name: Run actual first-install script
        shell: pwsh
        run: |
          python -m venv .venv
          $env:CI = '1'
          cmd.exe /d /c "首次安装.bat"
          if ($LASTEXITCODE -ne 0) { throw "首次安装.bat 失败：$LASTEXITCODE" }
          $py = '.\.venv\Scripts\python.exe'
          & $py -m pip install ruff
          & $py -m pip check
          & $py -c "import sys, importlib.metadata as m; print(sys.version); print('Playwright=' + m.version('playwright'))"

      - name: Dedicated Lingxing Python 3.11 environment smoke test
        if: matrix.python-version == '3.11'
        shell: pwsh
        run: |
          $env:CI = '1'
          $env:LINGXING_PYTHON = (Get-Command python.exe).Source
          $env:LINGXING_AUDIT_SETUP_ONLY = '1'
          cmd.exe /d /c "领星接口盘点.bat"
          if ($LASTEXITCODE -ne 0) { throw "领星接口盘点.bat 独立环境初始化失败：$LASTEXITCODE" }
          $lingxingPython = '.\.venv-lingxing\Scripts\python.exe'
          if (-not (Test-Path $lingxingPython)) { throw '未创建 .venv-lingxing' }
          & $lingxingPython -c "import sys; assert sys.version_info[:2] == (3, 11); import dotenv, lingxingapi_httpx; import importlib.metadata as m; assert m.version('lingxingapi-httpx') == '0.1.5'; print(sys.version); print('Lingxing=' + m.version('lingxingapi-httpx'))"
          if ($LASTEXITCODE -ne 0) { throw '领星独立环境版本或依赖检查失败' }

      - name: Python compile check
        shell: pwsh
        run: .\.venv\Scripts\python.exe -m compileall -q app tests

      - name: Pytest
        shell: pwsh
        run: .\.venv\Scripts\python.exe -m pytest -q

      - name: Fatal Python lint checks
        shell: pwsh
        run: .\.venv\Scripts\ruff.exe check app tests --select E9,F63,F7,F82

      - name: JavaScript syntax check
        run: node --check app/static/app.js

      - name: Launcher wrapper checks
        shell: pwsh
        run: |
          $mapping = @{
            '首次安装.bat' = 'scripts\first_install.ps1'
            '启动插件浏览器.bat' = 'scripts\start_plugin_browser.ps1'
            '启动程序.bat' = 'scripts\start_server.ps1'
            '停止程序.bat' = 'scripts\stop_server.ps1'
            '故障检查.bat' = 'scripts\diagnose.ps1'
            '领星接口盘点.bat' = 'lingxing_audit.ps1'
          }
          foreach ($entry in $mapping.GetEnumerator()) {
            if (-not (Test-Path $entry.Key)) { throw "缺少文件：$($entry.Key)" }
            if (-not (Test-Path $entry.Value)) { throw "缺少文件：$($entry.Value)" }
            $bytes = [System.IO.File]::ReadAllBytes((Resolve-Path $entry.Key))
            if ($bytes | Where-Object { $_ -gt 127 }) {
              throw "$($entry.Key) 必须保持纯 ASCII，避免 cmd.exe 误解析中文"
            }
            $text = Get-Content -Raw -Encoding ASCII $entry.Key
            if ($text -notmatch [regex]::Escape($entry.Value)) {
              throw "$($entry.Key) 没有调用 $($entry.Value)"
            }
          }

          $requirements = Get-Content -Raw -Encoding UTF8 'requirements.txt'
          if ($requirements -notmatch 'playwright>=1\.48,<1\.49') {
            throw 'Playwright 未锁定到 1.48 系列'
          }
          $lingxingRequirements = Get-Content -Raw -Encoding UTF8 'requirements-lingxing.txt'
          if ($lingxingRequirements -notmatch 'lingxingapi-httpx==0\.1\.5') {
            throw '领星 SDK 版本未锁定'
          }
          if ($lingxingRequirements -notmatch 'python-dotenv>=1,<2') {
            throw '领星独立环境缺少 python-dotenv'
          }
          $gitignore = Get-Content -Raw -Encoding UTF8 '.gitignore'
          if ($gitignore -notmatch '(?m)^\.env\r?$') {
            throw '.env 未加入 Git 忽略规则'
          }
          if ($gitignore -notmatch '(?m)^\.venv-lingxing/\r?$') {
            throw '.venv-lingxing 未加入 Git 忽略规则'
          }

      - name: Create test workbook
        shell: pwsh
        run: |
          .\.venv\Scripts\python.exe -c "from openpyxl import Workbook; w=Workbook(); s=w.active; s.title='测试产品线'; s.append(['品牌','尺寸','ASIN','星级（评价）','售价','是否我方']); s.append(['TEST','13','B0D3D2W989',None,100,'是']); w.save('产品输入表.xlsx')"

      - name: Real start and stop launcher smoke test
        shell: pwsh
        run: |
          $env:CI = '1'
          cmd.exe /d /c "启动程序.bat"
          if ($LASTEXITCODE -ne 0) { throw "启动程序.bat 失败：$LASTEXITCODE" }
          curl.exe --silent --fail --noproxy "*" --max-time 5 http://127.0.0.1:8787/api/status *> $null
          if ($LASTEXITCODE -ne 0) { throw '启动脚本结束后 8787 不可用' }
          cmd.exe /d /c "停止程序.bat"
          if ($LASTEXITCODE -ne 0) { throw "停止程序.bat 失败：$LASTEXITCODE" }
          Start-Sleep -Seconds 2
          curl.exe --silent --fail --noproxy "*" --max-time 2 http://127.0.0.1:8787/api/status *> $null
          if ($LASTEXITCODE -eq 0) { throw '停止脚本结束后 8787 仍在监听' }
          exit 0

      - name: Stop legacy system-Python server
        if: matrix.python-version == '3.11'
        shell: pwsh
        run: |
          $legacy = Start-Process -FilePath python -ArgumentList '-m uvicorn app.main:app --host 127.0.0.1 --port 8787' -WorkingDirectory $PWD -WindowStyle Hidden -PassThru
          for ($i = 0; $i -lt 30; $i++) {
            curl.exe --silent --fail --noproxy "*" --max-time 2 http://127.0.0.1:8787/api/status *> $null
            if ($LASTEXITCODE -eq 0) { break }
            Start-Sleep -Seconds 1
          }
          $env:CI = '1'
          cmd.exe /d /c "停止程序.bat"
          if ($LASTEXITCODE -ne 0) { throw '停止程序未能关闭旧式系统 Python 服务' }
          Start-Sleep -Seconds 2
          if (Get-Process -Id $legacy.Id -ErrorAction SilentlyContinue) {
            throw '旧式服务进程仍然存在'
          }

      - name: Real Chrome CDP connection smoke test
        if: matrix.python-version == '3.11'
        shell: pwsh
        run: |
          $candidates = @(
            "$env:ProgramFiles\Google\Chrome\Application\chrome.exe",
            "${env:ProgramFiles(x86)}\Google\Chrome\Application\chrome.exe"
          )
          $chrome = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $chrome) { throw 'CI 环境未找到 Chrome' }

          $env:CI = '1'
          $env:APP_CHROME_PATH = $chrome
          $env:APP_CHROME_USER_DATA_DIR = Join-Path $env:RUNNER_TEMP "competitor-cdp-$env:GITHUB_RUN_ID"
          cmd.exe /d /c "启动插件浏览器.bat"
          if ($LASTEXITCODE -ne 0) { throw "启动插件浏览器.bat 失败：$LASTEXITCODE" }

          .\.venv\Scripts\python.exe -m app.cdp_probe
          if ($LASTEXITCODE -ne 0) { throw 'Playwright CDP 实际连接失败' }

          $listener = Get-NetTCPConnection -LocalPort 9222 -State Listen -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($listener) { Stop-Process -Id $listener.OwningProcess -Force -ErrorAction SilentlyContinue }
