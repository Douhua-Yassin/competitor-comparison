name: Apply runtime regression fix

on:
  push:
    branches:
      - fix/windows-runtime-regression
    paths:
      - tools/apply_runtime_fix.py
      - .github/workflows/apply-runtime-fix.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/windows-runtime-regression
          fetch-depth: 0
      - name: Apply patch
        run: python tools/apply_runtime_fix.py
      - name: Commit patched source
        run: |
          git config user.name "runtime-fix-bot"
          git config user.email "runtime-fix-bot@users.noreply.github.com"
          git add app/main.py tools/apply_runtime_fix.py .github/workflows/apply-runtime-fix.yml
          git commit -m "修复 CDP 连接初始化超时"
          git push origin HEAD:fix/windows-runtime-regression
